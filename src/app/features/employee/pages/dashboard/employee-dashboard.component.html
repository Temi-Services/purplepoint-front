<!-- Modale -->
@if (showCallLog()) {
  <pp-call-log-form-modal (saved)="onSaved()" (closed)="showCallLog.set(false)" />
}

<!-- Templates colonnes -->
<ng-template #dateCell let-call>
  <span class="text-sm text-gray-800 dark:text-gray-200">
    {{ call.calledAt | date:'dd/MM/yyyy HH:mm' }}
  </span>
</ng-template>

<ng-template #outcomeCell let-call>
  <pp-badge [value]="call.outcome" />
</ng-template>

<div class="flex flex-col gap-6">

  <pp-welcome-card
    [userName]="userName()"
    subtitle="Gérez vos appels patients"
    imageUrl="https://storyset.com/illustration/phone-call/rafiki"
    imageAlt="Tableau de bord employé"
  >
    <button type="button" (click)="showCallLog.set(true)"
            class="inline-flex items-center gap-2 px-3 py-1.5 text-sm font-medium
                   bg-white/20 hover:bg-white/30 text-white rounded-lg transition-colors">
      <i class="ti ti-plus" aria-hidden="true"></i>
      Logger un appel
    </button>
  </pp-welcome-card>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <pp-stat-card
      label="Appels du jour"
      [value]="totalToday()"
      icon="ti-phone"
      color="primary"
      [loading]="statsLoading()"
    />
    <pp-stat-card
      label="Total appels"
      [value]="totalCalls()"
      icon="ti-phone-check"
      color="success"
      [loading]="statsLoading()"
      routerLink="/employee/calls"
    />
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-5 gap-6">

    <div class="lg:col-span-3 flex flex-col gap-3">
      <div class="flex items-center justify-between">
        <h2 class="text-base font-semibold text-gray-900 dark:text-gray-100">
          Appels récents
        </h2>
        <a routerLink="/employee/calls"
           class="text-sm text-primary hover:underline font-medium">
          Voir tous →
        </a>
      </div>
      <pp-data-table
        [columns]="columns()"
        [data]="recentCalls()"
        [total]="recentCalls().length"
        [loading]="tableLoading()"
        [showActions]="false"
      />
    </div>

    <div class="lg:col-span-2 flex flex-col gap-3">
      <h2 class="text-base font-semibold text-gray-900 dark:text-gray-100">
        Accès rapides
      </h2>
      <div class="card p-4">
        <button type="button" (click)="showCallLog.set(true)"
                class="btn-primary w-full justify-center">
          <i class="ti ti-phone-plus" aria-hidden="true"></i>
          Logger un appel
        </button>
      </div>
    </div>

  </div>
</div>
