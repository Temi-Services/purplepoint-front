@if (showConfirm()) {
  <pp-confirm-dialog
    [title]="'PATIENT.MED_CARD.CONFIRM_TITLE' | translate"
    [message]="confirmMessage()"
    [confirmLabel]="'PATIENT.MED_CARD.CONFIRM_LABEL' | translate"
    [loading]="isLoading()"
    (confirmed)="confirmTaken()"
    (cancelled)="cancelConfirm()"
  />
}

<div class="bg-surface rounded-lg border border-border p-4 flex items-start justify-between gap-4">
  <div class="flex items-start gap-3">
    <div class="w-9 h-9 rounded-lg flex items-center justify-center flex-shrink-0"
         [class]="takenToday() ? 'bg-green-50' : 'bg-primary-light'">
      @if (takenToday()) {
        <svg class="w-4 h-4 text-success" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
        </svg>
      } @else {
        <svg class="w-4 h-4 text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 3H5a2 2 0 00-2 2v4m6-6h10a2 2 0 012 2v4M9 3v18m0 0h10a2 2 0 002-2v-4M9 21H5a2 2 0 01-2-2v-4m0 0h18"/>
        </svg>
      }
    </div>
    <div>
      <p class="text-sm font-medium text-gray-900 dark:text-gray-100">{{ medication().name }}</p>
      <p class="text-xs text-muted mt-0.5">
        {{ medication().dosage }} · {{ medication().frequency | ppLabel:'frequency' }}
      </p>
      @if (takenToday()) {
        <p class="text-xs text-success mt-1 flex items-center gap-1">
          <svg class="w-3 h-3" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
          </svg>
          {{ 'PATIENT.MED_CARD.TAKEN_TODAY' | translate }}
        </p>
      }
    </div>
  </div>

  <button
    type="button"
    (click)="openConfirm()"
    [disabled]="takenToday() || isLoading()"
    class="flex-shrink-0 text-xs font-medium px-3 py-1.5 rounded-md transition-colors"
    [class]="takenToday()
      ? 'bg-green-50 text-success cursor-default'
      : isLoading()
        ? 'bg-surface-2 text-muted cursor-wait'
        : 'bg-primary-light text-primary hover:bg-primary hover:text-white'"
  >
    @if (isLoading()) {
      <svg class="animate-spin w-3.5 h-3.5" viewBox="0 0 24 24" fill="none">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/>
      </svg>
    } @else if (takenToday()) {
      {{ 'PATIENT.MED_CARD.TAKEN' | translate }} ✓
    } @else {
      {{ 'PATIENT.MED_CARD.MARK_TAKEN' | translate }}
    }
  </button>
</div>
