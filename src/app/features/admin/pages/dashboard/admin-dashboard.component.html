<!-- Modales -->
@if (showUserForm()) {
  <pp-user-form-modal
    (saved)="onUserSaved()"
    (closed)="closeForm()"
  />
}

<!-- Templates colonnes DataTable -->
<ng-template #nameCell let-user>
  <div class="flex items-center gap-2.5">
    <div class="w-7 h-7 rounded-full bg-primary-light flex items-center
                justify-center flex-shrink-0">
      <span class="text-xs font-semibold text-primary">
        {{ user.firstName[0] }}{{ user.lastName[0] }}
      </span>
    </div>
    <span class="text-sm font-medium text-gray-900 dark:text-gray-100">
      {{ user.firstName }} {{ user.lastName }}
    </span>
  </div>
</ng-template>

<ng-template #roleCell   let-user><pp-badge [value]="user.role"   /></ng-template>
<ng-template #statusCell let-user><pp-badge [value]="user.status" /></ng-template>

<!-- Page -->
<div class="flex flex-col gap-6">

  <!-- WelcomeCard -->
  <pp-welcome-card
    [userName]="userName()"
    subtitle="Gérez votre plateforme"
    imageUrl="https://storyset.com/illustration/online-doctor/rafiki"
    imageAlt="Tableau de bord administrateur"
  />

  <!-- StatCards -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
    <pp-stat-card
      label="Utilisateurs"
      [value]="totalUsers()"
      icon="ti-users"
      color="primary"
      [loading]="statsLoading()"
      routerLink="/admin/users"
    />
    <pp-stat-card
      label="Patients"
      [value]="totalPatients()"
      icon="ti-user-heart"
      color="info"
      [loading]="statsLoading()"
    />
    <pp-stat-card
      label="Employés"
      [value]="totalEmployees()"
      icon="ti-user-check"
      color="success"
      [loading]="statsLoading()"
    />
    <pp-stat-card
      label="Campagnes"
      [value]="totalCampaigns()"
      icon="ti-speakerphone"
      color="warning"
      [loading]="statsLoading()"
      routerLink="/admin/campaigns"
    />
  </div>

  <!-- Grille principale -->
  <div class="grid grid-cols-1 lg:grid-cols-5 gap-6">

    <!-- Section principale : derniers utilisateurs (60%) -->
    <div class="lg:col-span-3 flex flex-col gap-3">
      <div class="flex items-center justify-between">
        <h2 class="text-base font-semibold text-gray-900 dark:text-gray-100">
          Derniers utilisateurs
        </h2>
        <a routerLink="/admin/users"
           class="text-sm text-primary hover:underline font-medium">
          Voir tous →
        </a>
      </div>

      <pp-data-table
        [columns]="columns()"
        [data]="recentUsers()"
        [total]="recentUsers().length"
        [loading]="tableLoading()"
        [showActions]="false"
      />
    </div>

    <!-- Accès rapides (40%) -->
    <div class="lg:col-span-2 flex flex-col gap-3">
      <h2 class="text-base font-semibold text-gray-900 dark:text-gray-100">
        Accès rapides
      </h2>

      <div class="card p-5 flex flex-col gap-3">
        <button type="button" (click)="openCreate()" class="btn-primary w-full justify-center">
          <i class="ti ti-user-plus" aria-hidden="true"></i>
          Créer un utilisateur
        </button>

        <a routerLink="/admin/campaigns"
           class="btn-ghost w-full justify-center border border-border rounded-lg">
          <i class="ti ti-speakerphone" aria-hidden="true"></i>
          Gérer les campagnes
        </a>
      </div>
    </div>

  </div>
</div>
